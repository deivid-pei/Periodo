<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciclo</title>
<meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16150F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ciclo">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23FAF8F5'/%3E%3Ccircle cx='90' cy='90' r='42' fill='none' stroke='%23C0736A' stroke-width='8'/%3E%3Ccircle cx='90' cy='48' r='11' fill='%23C0736A'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23C0736A' stroke-width='4'/%3E%3Ccircle cx='32' cy='16' r='5' fill='%23C0736A'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#FAF8F5;
    --surface:#FFFFFF;
    --ink:#1B1A17;
    --muted:#8C877E;
    --line:#E8E3DB;
    --accent:#C0736A;
    --accent-soft:#F4E7E4;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16150F;
      --surface:#1E1D17;
      --ink:#F2EFE9;
      --muted:#918C82;
      --line:#2C2A22;
      --accent:#D98D82;
      --accent-soft:#2E211E;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:460px;margin:0 auto;padding:32px 20px 64px}

  header{display:flex;align-items:center;gap:10px;margin-bottom:34px}
  header svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.6}
  header svg .dot{fill:var(--accent);stroke:none}
  header h1{
    font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    margin:0;color:var(--ink);
  }

  /* ---- hero ---- */
  .hero{margin-bottom:32px}
  .hero .label{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin-bottom:6px;
  }
  .hero .value{
    display:flex;align-items:baseline;gap:8px;
  }
  .hero .num{
    font-size:76px;line-height:.9;font-weight:300;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;
  }
  .hero .unit{font-size:15px;color:var(--muted)}
  .hero .sub{margin-top:12px;font-size:13.5px;color:var(--muted)}

  /* ---- stats row ---- */
  .stats{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:30px}
  .stat{flex:1;background:var(--surface);padding:14px 14px 15px}
  .stat .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .stat .v{font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
  .stat .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}

  /* ---- form ---- */
  .section-title{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    margin:0 0 12px;font-weight:600;
  }
  form{display:flex;gap:8px;margin-bottom:8px}
  input[type="date"]{
    flex:1;min-width:0;
    font:inherit;font-size:15px;color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 14px;
    appearance:none;
  }
  input[type="date"]:focus{outline:none;border-color:var(--accent)}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn-add{
    background:var(--accent);color:#fff;
    border-radius:var(--radius);
    padding:0 18px;
    display:flex;align-items:center;justify-content:center;
    min-width:52px;
  }
  .btn-add svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round}
  .btn-add:active{opacity:.75}
  .hint{font-size:12.5px;color:var(--muted);min-height:18px;margin-bottom:34px}
  .hint.err{color:var(--accent)}

  /* ---- list ---- */
  ul{list-style:none;margin:0;padding:0}
  li{
    display:flex;align-items:center;gap:12px;
    padding:15px 0;border-bottom:1px solid var(--line);
  }
  li:first-child{border-top:1px solid var(--line)}
  .date{flex:1;font-size:15.5px}
  .date .yr{color:var(--muted);font-size:13px;margin-left:5px}
  .gap{
    font-size:13px;color:var(--accent);background:var(--accent-soft);
    padding:3px 9px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .gap.none{color:var(--muted);background:transparent;padding-right:0}
  .del{padding:6px;display:flex;opacity:.4}
  .del svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.5;stroke-linecap:round}
  .del:active{opacity:.9}

  .empty{
    text-align:center;color:var(--muted);font-size:14px;
    padding:38px 10px;border:1px dashed var(--line);border-radius:var(--radius);
  }

  /* ---- footer actions ---- */
  footer{margin-top:38px;display:flex;gap:22px;align-items:center}
  .link{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;color:var(--muted);
  }
  .link svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .link:active{color:var(--ink)}
  #file{display:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="6.5"/><circle class="dot" cx="12" cy="4.6" r="2.2"/></svg>
    <h1>Ciclo</h1>
  </header>

  <section class="hero">
    <div class="label">Último ciclo</div>
    <div class="value">
      <span class="num" id="heroNum">—</span>
      <span class="unit" id="heroUnit">días</span>
    </div>
    <div class="sub" id="heroSub">Registra el inicio de tu periodo para comenzar.</div>
  </section>

  <div class="stats">
    <div class="stat">
      <div class="k">Promedio</div>
      <div class="v" id="avg">—</div>
    </div>
    <div class="stat">
      <div class="k">Día del ciclo</div>
      <div class="v" id="today">—</div>
    </div>
  </div>

  <h2 class="section-title">Nuevo inicio de periodo</h2>
  <form id="form">
    <input type="date" id="input" required>
    <button class="btn-add" type="submit" aria-label="Agregar fecha">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>
  <div class="hint" id="hint"></div>

  <h2 class="section-title">Registro</h2>
  <ul id="list"></ul>
  <div class="empty" id="empty">Aún no hay fechas registradas.</div>

  <footer>
    <button class="link" id="export">
      <svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M4 20h16"/></svg>
      Respaldar
    </button>
    <button class="link" id="import">
      <svg viewBox="0 0 24 24"><path d="M12 16V4M7 8l5-5 5 5M4 20h16"/></svg>
      Restaurar
    </button>
    <input type="file" id="file">
  </footer>

</div>

<script>
(function(){
  "use strict";
  var KEY = "ciclo.fechas.v1";
  var MS = 86400000;

  var MESES = ["enero","febrero","marzo","abril","mayo","junio",
               "julio","agosto","septiembre","octubre","noviembre","diciembre"];

  /* ---------- almacenamiento ---------- */
  var memoria = null; // respaldo si localStorage no está disponible

  function leer(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){ return memoria ? memoria.slice() : []; }
    if(!raw) return [];
    try{
      var arr = JSON.parse(raw);
      if(!Array.isArray(arr)) return [];
      return arr.filter(esISO);
    }catch(e){ return []; }
  }

  function guardar(arr){
    memoria = arr.slice();
    try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch(e){}
  }

  /* ---------- utilidades de fecha ---------- */
  function esISO(s){
    if(typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split("-").map(Number);
    var d = new Date(Date.UTC(p[0], p[1]-1, p[2]));
    return d.getUTCFullYear()===p[0] && d.getUTCMonth()===p[1]-1 && d.getUTCDate()===p[2];
  }

  function aNum(iso){                 // ISO -> milisegundos UTC (sin zona horaria)
    var p = iso.split("-").map(Number);
    return Date.UTC(p[0], p[1]-1, p[2]);
  }

  function diffDias(isoA, isoB){      // días de A a B
    return Math.round((aNum(isoB) - aNum(isoA)) / MS);
  }

  function hoyISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + m + "-" + dd;
  }

  function formatear(iso){
    var p = iso.split("-").map(Number);
    return { dia: p[2] + " de " + MESES[p[1]-1], anio: String(p[0]) };
  }

  /* ---------- estado ---------- */
  var fechas = leer();                // siempre ordenadas de más reciente a más antigua

  function ordenar(){
    fechas.sort(function(a,b){ return aNum(b) - aNum(a); });
  }

  /* ---------- elementos ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var heroNum = $("heroNum"), heroUnit = $("heroUnit"), heroSub = $("heroSub");
  var avgEl = $("avg"), todayEl = $("today");
  var list = $("list"), empty = $("empty"), hint = $("hint"), input = $("input");

  /* ---------- render ---------- */
  function ciclos(){
    var out = [];
    for(var i = 0; i < fechas.length - 1; i++){
      out.push(diffDias(fechas[i+1], fechas[i]));
    }
    return out; // out[0] = ciclo más reciente
  }

  function render(){
    ordenar();
    var cs = ciclos();

    // ---- hero: diferencia entre los dos últimos inicios ----
    if(cs.length){
      heroNum.textContent = cs[0];
      heroUnit.textContent = cs[0] === 1 ? "día" : "días";
      var a = formatear(fechas[1]), b = formatear(fechas[0]);
      heroSub.textContent = "Del " + a.dia + " al " + b.dia + ".";
    }else if(fechas.length === 1){
      heroNum.textContent = "—";
      heroUnit.textContent = "días";
      heroSub.textContent = "Registra el siguiente inicio para calcular la duración del ciclo.";
    }else{
      heroNum.textContent = "—";
      heroUnit.textContent = "días";
      heroSub.textContent = "Registra el inicio de tu periodo para comenzar.";
    }

    // ---- promedio ----
    if(cs.length){
      var suma = cs.reduce(function(s,n){ return s+n; }, 0);
      var prom = Math.round(suma / cs.length);
      avgEl.innerHTML = prom + '<small>días</small>';
    }else{
      avgEl.textContent = "—";
    }

    // ---- día actual del ciclo ----
    if(fechas.length){
      var d = diffDias(fechas[0], hoyISO()) + 1;
      todayEl.textContent = d > 0 ? String(d) : "—";
    }else{
      todayEl.textContent = "—";
    }

    // ---- lista ----
    list.innerHTML = "";
    empty.style.display = fechas.length ? "none" : "block";

    fechas.forEach(function(iso, i){
      var f = formatear(iso);
      var li = document.createElement("li");

      var d = document.createElement("div");
      d.className = "date";
      d.textContent = f.dia;
      var yr = document.createElement("span");
      yr.className = "yr";
      yr.textContent = f.anio;
      d.appendChild(yr);

      var g = document.createElement("span");
      if(i < fechas.length - 1){
        var n = diffDias(fechas[i+1], iso);
        g.className = "gap";
        g.textContent = "+" + n + (n === 1 ? " día" : " días");
      }else{
        g.className = "gap none";
        g.textContent = "inicio";
      }

      var btn = document.createElement("button");
      btn.className = "del";
      btn.setAttribute("aria-label", "Eliminar " + f.dia);
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
      btn.addEventListener("click", function(){
        if(confirm("¿Eliminar el " + f.dia + " de " + f.anio + "?")){
          fechas = fechas.filter(function(x){ return x !== iso; });
          guardar(fechas);
          mensaje("");
          render();
        }
      });

      li.appendChild(d); li.appendChild(g); li.appendChild(btn);
      list.appendChild(li);
    });
  }

  function mensaje(txt, error){
    hint.textContent = txt;
    hint.className = "hint" + (error ? " err" : "");
  }

  /* ---------- agregar ---------- */
  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var v = input.value;
    if(!esISO(v)){ mensaje("Selecciona una fecha válida.", true); return; }
    if(diffDias(hoyISO(), v) > 0){ mensaje("Esa fecha aún no ha llegado.", true); return; }
    if(fechas.indexOf(v) !== -1){ mensaje("Esa fecha ya está registrada.", true); return; }

    fechas.push(v);
    guardar(fechas);
    ordenar();

    var idx = fechas.indexOf(v);
    if(idx < fechas.length - 1){
      var n = diffDias(fechas[idx+1], v);
      mensaje("Guardado · " + n + (n === 1 ? " día" : " días") + " desde el inicio anterior.");
    }else{
      mensaje("Guardado.");
    }
    input.value = "";
    render();
  });

  /* ---------- respaldo ---------- */
  function descargar(texto, nombre){
    var blob = new Blob([texto], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    mensaje("Respaldo guardado en tus descargas.");
  }

  $("export").addEventListener("click", function(){
    if(!fechas.length){ mensaje("No hay fechas para respaldar.", true); return; }
    var texto = JSON.stringify(fechas, null, 2);
    var nombre = "ciclo-" + hoyISO() + ".json";

    // iOS / móvil: compartir el archivo (Archivos, Notas, WhatsApp, correo…)
    try{
      var file = new File([texto], nombre, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
        navigator.share({files:[file], title:"Respaldo Ciclo"})
          .then(function(){ mensaje("Respaldo compartido."); })
          .catch(function(err){
            if(err && err.name === "AbortError"){ mensaje(""); return; }
            descargar(texto, nombre);
          });
        return;
      }
    }catch(e){}

    descargar(texto, nombre);
  });

  $("import").addEventListener("click", function(){ $("file").click(); });

  $("file").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var arr = JSON.parse(r.result);
        if(!Array.isArray(arr)) throw 0;
        var limpio = arr.filter(esISO);
        if(!limpio.length) throw 0;
        limpio.forEach(function(iso){
          if(fechas.indexOf(iso) === -1) fechas.push(iso);
        });
        guardar(fechas);
        render();
        mensaje("Restauradas " + limpio.length + " fechas.");
      }catch(err){
        mensaje("El archivo no es un respaldo válido.", true);
      }
    };
    r.readAsText(f);
    e.target.value = "";
  });

  /* ---------- inicio ---------- */
  input.max = hoyISO();
  render();
})();
</script>
</body>
</html>
